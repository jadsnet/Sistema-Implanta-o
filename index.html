<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão de Implantação</title>
<style>
:root{--bg:#050d1a;--panel:#0b1a2c;--panel2:#10243b;--line:#1e3855;--text:#e8f1ff;--muted:#8da7c6;--blue:#3985ff;--green:#22c58b;--yellow:#f2b632;--red:#ff6074}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px Inter,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:1px solid #2a527d;background:var(--blue);color:white;padding:8px 12px;border-radius:7px;cursor:pointer}button:hover{filter:brightness(1.12)}button.secondary{background:#12263e}button.danger{background:#4b1d2b;border-color:#8b3449}.app{display:flex;min-height:100vh}.sidebar{width:185px;background:#071323;border-right:1px solid var(--line);padding:16px 10px;flex-shrink:0}.brand{font-size:12px;font-weight:800;letter-spacing:1px;color:#6ea8ff;margin:3px 7px 4px}.brand2{font-size:17px;font-weight:800;margin:0 7px 20px}.nav{display:block;width:100%;text-align:left;background:transparent;border-color:transparent;color:#a9bfd9;margin:5px 0}.nav.active,.nav:hover{background:#112a47;border-color:#2b5d91;color:white}.main{flex:1;min-width:0;padding:22px;max-width:1600px;margin:0 auto;width:100%}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.eyebrow{font-size:10px;letter-spacing:1.8px;color:#5e9cff;font-weight:800;text-transform:uppercase}.watermark{font-size:15px;letter-spacing:5px;color:#13253b;font-weight:900;text-align:center}.title{font-size:23px;margin:5px 0 15px}.sub{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px;margin:12px 0}.panel h3{margin:0 0 12px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.project{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:18px;text-align:center;cursor:pointer}.project:hover,.project.selected{border-color:var(--blue);box-shadow:0 0 0 1px #3985ff44}.project .letter{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;background:var(--blue);font-weight:900;font-size:18px;margin-bottom:8px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px}.stat b{display:block;font-size:22px;margin-top:7px}.stat span{color:var(--muted);font-size:11px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}.field input,.field select,.field textarea,input,select,textarea{background:#10243b;border:1px solid #203b59;color:var(--text);border-radius:6px;padding:9px;min-width:0}.field input:focus,.field select:focus,input:focus{outline:1px solid var(--blue)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px}th{font-size:10px;text-transform:uppercase;color:var(--muted)}td{font-size:12px}.status{border-radius:20px;padding:4px 8px;font-size:10px;white-space:nowrap;background:#26384d}.status.Pendente{color:#ffd26d}.status['Em andamento']{color:#80b6ff}.status.Concluída{color:#4be0ae}.status.Quebra{color:#ff8796}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.hidden{display:none!important}.detailhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.toast{position:fixed;right:18px;bottom:18px;background:#163b34;border:1px solid #267d68;padding:12px 16px;border-radius:8px;display:none;z-index:9}.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{background:#10243b}.tabs button.active{background:var(--blue)}.small{font-size:11px}.muted{color:var(--muted)}.empty{padding:25px;text-align:center;color:var(--muted)}.filelabel{display:inline-block;background:#12263e;border:1px solid #2a527d;border-radius:7px;padding:8px 12px;cursor:pointer}.filelabel input{display:none}@media(max-width:700px){.app{display:block}.sidebar{width:auto;display:flex;gap:4px;align-items:center;overflow:auto;padding:8px}.brand,.brand2{display:none}.nav{white-space:nowrap;width:auto;margin:0}.main{padding:12px}.watermark{display:none}.title{font-size:20px}}
</style></head><body><div class="app"><aside class="sidebar"><div><div class="brand">IMPLANTAÇÃO</div><div class="brand2">Gestão de Projetos</div></div><button class="nav active" data-page="home">⌂ &nbsp; Início</button><button class="nav" data-page="runbook">▤ &nbsp; Runbook</button><button class="nav" data-page="logs">☷ &nbsp; Log</button><button class="nav" data-page="admin">⚙ &nbsp; Painel do administrador</button></aside><main class="main"><div class="topline"><div><div class="eyebrow" id="sectionEyebrow">PROJETOS</div><h1 class="title" id="pageTitle">Selecione um projeto</h1></div><div class="watermark" id="watermark"></div></div><div id="appContent"></div></main></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);let DB={},page='home',projectId=null,selectedActivity=null,adminTab='Projetos',filterStatus='Todos';
const statuses=['Pendente','Em andamento','Concluída','Quebra'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=k=>DB[k]||[];const project=()=>arr('projects').find(x=>x.id===projectId);
function toast(s){let t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function save(){localStorage.setItem('gestaoImplantacaoDB',JSON.stringify(DB))}
function log(action,detail='',actId=''){DB.log.unshift({id:'log_'+Date.now(),data:{act:action,action,detail,actId,ts:new Date().toISOString(),user:localStorage.getItem('gi_user')||'Administrador'}});save()}
function normStatus(s){if(!s)return'Pendente';let v=String(s).toLowerCase();if(v.includes('andamento'))return'Em andamento';if(v.includes('conclu'))return'Concluída';if(v.includes('quebra')||v.includes('aband'))return'Quebra';return'Pendente'}
function getName(p){return p?.data?.name||p?.id||'Projeto'}
function activityName(a){let r=a.data.row||{};return r['ID VGR']||r['ID']||a.id}
function projectActivities(){let p=project();return arr('activities').filter(a=>{let r=a.data.row||{};return !p||!p.data.name||String(r.EMPRESA||'').toLowerCase()===String(p.data.name).toLowerCase()||a.data.projectId===p.id})}
function render(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#sectionEyebrow').textContent=page==='home'?'PROJETOS':page==='runbook'?'RUNBOOK':page==='logs'?'AUDITORIA':'ADMINISTRAÇÃO';$('#watermark').textContent=project()?('PROJETO '+getName(project()).toUpperCase()):'';$('#pageTitle').textContent=page==='home'?(project()?'Projeto '+getName(project()):'Selecione um projeto'):page==='runbook'?'Realizar runbook':page==='logs'?'Log de atividades':'Painel do administrador';if(page==='home')renderHome();if(page==='runbook')renderRunbook();if(page==='logs')renderLogs();if(page==='admin')renderAdmin()}
function renderHome(){let c=$('#appContent');if(!project()){c.innerHTML=`<div class="panel"><h3>Selecione um projeto</h3><div class="grid">${arr('projects').map(p=>`<div class="project" data-project="${esc(p.id)}"><div class="letter">${esc(getName(p).slice(0,1))}</div><div><b>${esc(getName(p))}</b></div><div class="sub small">${arr('activities').filter(a=>String((a.data.row||{}).EMPRESA||'').toLowerCase()===getName(p).toLowerCase()).length} atividades</div></div>`).join('')}</div></div>`;c.querySelectorAll('[data-project]').forEach(el=>el.onclick=()=>{projectId=el.dataset.project;selectedActivity=null;render()});return}
let acts=projectActivities();let counts=Object.fromEntries(statuses.map(s=>[s,acts.filter(a=>normStatus(a.data.status)===s).length]));c.innerHTML=`<div class="detailhead"><button class="secondary" id="backProjects">← Projetos</button><div class="tabs">${['Todos',...statuses].map(s=>`<button class="${filterStatus===s?'active':''}" data-filter="${s}">${s}</button>`).join('')}</div></div><div class="stats">${statuses.map((s,i)=>`<div class="stat"><span>${s}</span><b>${counts[s]}</b></div>`).join('')}</div><div class="panel"><h3>Buscar atividade</h3><div class="filters"><input id="searchActivity" placeholder="ID, ID VGR, endereço, hostname..." style="flex:1;min-width:220px"><button id="clearSearch" class="secondary">Limpar</button></div><div id="activityList"></div></div>${selectedActivity?activityDetail(selectedActivity):''}`;
$('#backProjects').onclick=()=>{projectId=null;selectedActivity=null;render()};c.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filterStatus=b.dataset.filter;render()});$('#searchActivity').oninput=renderActivityList;$('#clearSearch').onclick=()=>{$('#searchActivity').value='';renderActivityList()};renderActivityList();wireDetail()}
function renderActivityList(){let q=($('#searchActivity')?.value||'').toLowerCase();let acts=projectActivities().filter(a=>(filterStatus==='Todos'||normStatus(a.data.status)===filterStatus)&&JSON.stringify(a.data.row||{}).toLowerCase().includes(q));$('#activityList').innerHTML=acts.slice(0,150).map(a=>{let r=a.data.row||{};return `<div class="panel" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;margin:7px 0"><div><b>${esc(activityName(a))}</b><div class="small muted">${esc(r.HOSTNAME||r['ENDEREÇO COMPLETO']||r.EMPRESA||'Atividade')} · ${esc(r['ENDEREÇO COMPLETO']||'')}</div></div><div style="display:flex;align-items:center;gap:8px"><span class="status ${esc(normStatus(a.data.status))}">${esc(normStatus(a.data.status))}</span><button data-open="${esc(a.id)}">Abrir</button></div></div>`}).join('')||'<div class="empty">Nenhuma atividade encontrada.</div>';$('#activityList').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selectedActivity=b.dataset.open;render()})}
function activityDetail(id){let a=arr('activities').find(x=>x.id===id);if(!a)return'';let d=a.data,r=d.row||{};let fields=Object.entries(r);return `<div class="panel" id="activityDetail"><div class="detailhead"><div><div class="eyebrow">ID VGR</div><h2>${esc(activityName(a))}</h2><span class="muted">${esc(r['ENDEREÇO COMPLETO']||'')}</span></div><button class="secondary" id="closeDetail">Fechar</button></div><div class="row" style="margin:15px 0"><div class="field"><label>Status</label><select id="actStatus">${statuses.map(s=>`<option ${normStatus(d.status)===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Analista responsável</label><input id="actAnalyst" value="${esc(d.analystName||'')}" placeholder="Nome do analista"></div><div class="field"><label>Motivo da quebra</label><input id="actReason" value="${esc(d.reason||'')}" placeholder="Se aplicável"></div></div><div class="row">${fields.map(([k,v])=>`<div class="field"><label>${esc(k)}</label><input readonly value="${esc(v)}"></div>`).join('')}</div><div class="filters"><button id="adoptActivity">Assumir atividade</button><button id="saveActivity">Salvar alterações</button><button class="secondary" id="startActivity">Iniciar</button><button class="secondary" id="finishActivity">Concluir</button></div></div>`}
function wireDetail(){if(!$('#activityDetail'))return;$('#closeDetail').onclick=()=>{selectedActivity=null;render()};const update=(status)=>{let a=arr('activities').find(x=>x.id===selectedActivity);a.data.status=status;if(status==='Em andamento'&&!a.data.startAt)a.data.startAt=new Date().toISOString();if(status==='Concluída')a.data.endAt=new Date().toISOString();if(status==='Quebra')a.data.reason=$('#actReason').value;log('Status alterado',`${activityName(a)}: ${status}`,a.id);save();toast('Atividade atualizada');render()};$('#adoptActivity').onclick=()=>{let a=arr('activities').find(x=>x.id===selectedActivity);a.data.analystName=$('#actAnalyst').value||localStorage.getItem('gi_user')||'Administrador';a.data.analystId=a.data.analystName;a.data.status='Em andamento';a.data.startAt=a.data.startAt||new Date().toISOString();log('Atividade assumida',activityName(a),a.id);save();render()};$('#saveActivity').onclick=()=>{let a=arr('activities').find(x=>x.id===selectedActivity);a.data.status=$('#actStatus').value;a.data.analystName=$('#actAnalyst').value;a.data.reason=$('#actReason').value;log('Atividade editada',activityName(a),a.id);save();toast('Alterações salvas');render()};$('#startActivity').onclick=()=>update('Em andamento');$('#finishActivity').onclick=()=>update('Concluída')}
function renderRunbook(){let acts=projectActivities(),q='';$('#appContent').innerHTML=`<div class="panel"><h3>Buscar atividade</h3><input id="rbSearch" placeholder="Digite o ID, VGR ou hostname" style="width:100%"></div><div id="rbList"></div>`;function list(){let query=$('#rbSearch').value.toLowerCase();let list=acts.filter(a=>JSON.stringify(a.data.row||{}).toLowerCase().includes(query));$('#rbList').innerHTML=list.slice(0,100).map(a=>{let r=a.data.row||{};return `<div class="panel"><div class="detailhead"><div><b>${esc(activityName(a))}</b><div class="small muted">${esc(r.HOSTNAME||r['ENDEREÇO COMPLETO']||'')}</div></div><button data-rb="${esc(a.id)}">Realizar runbook</button></div></div>`}).join('')||'<div class="empty">Nenhuma atividade encontrada.</div>';$('#rbList').querySelectorAll('[data-rb]').forEach(b=>b.onclick=()=>openRunbook(b.dataset.rb))}$('#rbSearch').oninput=list;list()}
function openRunbook(id){let a=arr('activities').find(x=>x.id===id);let r=a.data.row||{};let existing=arr('runbooks').find(x=>x.data.activityId===id);let slots=existing?.data.slots||[];let defaults=['Validar acesso ao equipamento','Validar conectividade','Validar endereçamento IP','Validar LAN/WAN','Registrar evidências','Validar serviço com o solicitante'];$('#appContent').innerHTML=`<div class="panel"><button class="secondary" id="rbBack">← Voltar</button><h2>Runbook · ${esc(activityName(a))}</h2><p class="muted">${esc(r.HOSTNAME||r['ENDEREÇO COMPLETO']||'')}</p><div id="rbSteps">${defaults.map((s,i)=>{let val=slots[i]||{};return `<div class="panel"><label><input type="checkbox" data-step="${i}" ${val.done?'checked':''}> ${esc(s)}</label><textarea data-note="${i}" placeholder="Evidências / observações" style="width:100%;margin-top:8px">${esc(val.note||'')}</textarea></div>`}).join('')}</div><button id="saveRunbook">Salvar runbook</button></div>`;$('#rbBack').onclick=render;$('#saveRunbook').onclick=()=>{let run=arr('runbooks').find(x=>x.data.activityId===id);if(!run){run={id:'rb_'+Date.now(),data:{activityId:id,slots:[],by:localStorage.getItem('gi_user')||'Administrador',startedAt:new Date().toISOString()}};DB.runbooks.push(run)}run.data.slots=defaults.map((s,i)=>({title:s,done:$(`[data-step="${i}"]`).checked,note:$(`[data-note="${i}"]`).value}));run.data.updatedAt=new Date().toISOString();log('Runbook salvo',activityName(a),id);save();toast('Runbook salvo')}}
function renderLogs(){let logs=arr('log');$('#appContent').innerHTML=`<div class="panel"><h3>Histórico de ações</h3><div class="filters"><input id="logSearch" placeholder="Buscar por ação, usuário ou detalhe" style="flex:1"><button id="exportLogs">Exportar CSV</button></div><div class="tablewrap"><table><thead><tr><th>Data</th><th>Ação</th><th>Usuário</th><th>Detalhe</th></tr></thead><tbody id="logsBody"></tbody></table></div></div>`;function draw(){let q=$('#logSearch').value.toLowerCase();$('#logsBody').innerHTML=logs.filter(x=>JSON.stringify(x.data).toLowerCase().includes(q)).slice(0,500).map(x=>`<tr><td>${esc(x.data.ts||'')}</td><td>${esc(x.data.act||x.data.action||'')}</td><td>${esc(x.data.user||'')}</td><td>${esc(x.data.detail||x.data.actId||'')}</td></tr>`).join('')}$('#logSearch').oninput=draw;$('#exportLogs').onclick=()=>downloadCSV('logs.csv',logs.map(x=>x.data));draw()}
function renderAdmin(){let tabs=['Projetos','Usuários','Planilhas'];$('#appContent').innerHTML=`<div class="tabs">${tabs.map(t=>`<button class="${adminTab===t?'active':''}" data-atab="${t}">${t}</button>`).join('')}</div><div id="adminBody"></div>`;document.querySelectorAll('[data-atab]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.atab;renderAdmin()});let b=$('#adminBody');if(adminTab==='Projetos'){b.innerHTML=`<div class="panel"><h3>Cadastrar novo projeto</h3><div class="filters"><input id="newProject" placeholder="Nome do projeto"><button id="createProject">Criar projeto</button></div><div class="sub small">Os projetos podem ser selecionados na tela inicial.</div></div><div class="panel"><h3>Projetos cadastrados</h3>${arr('projects').map(p=>`<div class="detailhead panel"><div><b>${esc(getName(p))}</b><div class="small muted">${arr('activities').filter(a=>String((a.data.row||{}).EMPRESA||'').toLowerCase()===getName(p).toLowerCase()).length} atividades</div></div><button class="secondary" data-selectp="${esc(p.id)}">Selecionar</button></div>`).join('')}</div>`;$('#createProject').onclick=()=>{let name=$('#newProject').value.trim();if(!name)return toast('Informe o nome do projeto');let id=name.toLowerCase().replace(/[^a-z0-9]+/g,'-');if(arr('projects').some(p=>p.id===id))return toast('Projeto já existe');DB.projects.push({id,data:{name,createdAt:new Date().toISOString()}});log('Projeto criado',name);save();renderAdmin()};b.querySelectorAll('[data-selectp]').forEach(x=>x.onclick=()=>{projectId=x.dataset.selectp;page='home';render()})}
if(adminTab==='Usuários'){b.innerHTML=`<div class="panel"><h3>Cadastrar usuário</h3><div class="row"><div class="field"><label>Nome</label><input id="uName"></div><div class="field"><label>Sobrenome</label><input id="uLast"></div><div class="field"><label>E-mail</label><input id="uEmail" type="email"></div><div class="field"><label>RE / matrícula</label><input id="uRe"></div></div><button id="createUser" style="margin-top:12px">Salvar usuário</button></div><div class="panel"><h3>Usuários cadastrados</h3>${arr('users').map(u=>`<div class="panel"><b>${esc((u.data.nome||'')+' '+(u.data.sobrenome||''))}</b><div class="small muted">${esc(u.data.email||'')} · ${esc(u.data.re||'')}</div></div>`).join('')||'<div class="empty">Nenhum usuário.</div>'}</div>`;$('#createUser').onclick=()=>{let nome=$('#uName').value.trim(),email=$('#uEmail').value.trim();if(!nome||!email)return toast('Nome e e-mail são obrigatórios');DB.users.push({id:'u_'+Date.now(),data:{nome,sobrenome:$('#uLast').value,email,re:$('#uRe').value,at:new Date().toISOString()}});log('Usuário cadastrado',email);save();renderAdmin()}}
if(adminTab==='Planilhas'){b.innerHTML=`<div class="panel"><h3>Importar planilha de atividades</h3><p class="muted">Importe CSV (UTF-8). A primeira linha deve conter os nomes das colunas, como EMPRESA, ID, ID VGR, HOSTNAME e ENDEREÇO COMPLETO.</p><label class="filelabel">Escolher arquivo CSV<input type="file" id="activityFile" accept=".csv,.txt"></label><button id="exportActivities" class="secondary">Exportar atividades CSV</button><div id="importResult" class="small muted" style="margin-top:12px"></div></div><div class="panel"><h3>Importar runbook em JSON</h3><label class="filelabel">Escolher arquivo JSON<input type="file" id="runbookFile" accept=".json"></label><div class="small muted">Importa uma lista de etapas para o conjunto de runbooks.</div></div>`;$('#activityFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;let text=await f.text(),rows=parseCSV(text);if(rows.length<2)return toast('CSV vazio ou inválido');let headers=rows[0];let added=0;for(let row of rows.slice(1)){if(!row.some(v=>v.trim()))continue;let obj={};headers.forEach((h,i)=>obj[h.trim()]=row[i]||'');let id='imp_'+Date.now()+'_'+added;DB.activities.push({id,data:{row:obj,status:'Pendente',analystName:null,analystId:null,startAt:null,endAt:null,reason:null,keys:Object.values(obj).join('|')}});added++}log('Importação CSV',`${added} atividades importadas`);save();$('#importResult').textContent=`Importadas ${added} atividades.`;toast('Importação concluída')};$('#exportActivities').onclick=()=>downloadCSV('atividades.csv',arr('activities').map(a=>({...a.data.row,_status:a.data.status,_analista:a.data.analystName,_motivo:a.data.reason})));$('#runbookFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());DB.runbookTemplate=Array.isArray(x)?x:(x.steps||x.slots||[]);save();toast('Modelo de runbook importado')}catch{toast('JSON inválido')}}}}
function parseCSV(t){let out=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'&&q&&t[i+1]==='"'){cell+='"';i++}else if(c==='"')q=!q;else if((c===','||c===';'||c==='\\t')&&!q){row.push(cell);cell=''}else if((c==='\\n'||c==='\\r')&&!q){if(c==='\\r'&&t[i+1]==='\\n')i++;row.push(cell);out.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);out.push(row)}return out}
function downloadCSV(name,rows){let keys=[...new Set(rows.flatMap(o=>Object.keys(o||{})))];let csv=[keys,...rows.map(o=>keys.map(k=>{let v=o[k];if(v&&typeof v==='object')v=JSON.stringify(v);return '"'+String(v??'').replace(/"/g,'""')+'"'}))].map(r=>r.join(';')).join('\\r\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
async function init(){try{let saved=localStorage.getItem('gestaoImplantacaoDB');if(saved)DB=JSON.parse(saved);else{let res=await fetch('./data.json');DB=await res.json();save()}}catch(e){$('#appContent').innerHTML='<div class="panel">Não foi possível carregar data.json. Execute por servidor local (ex.: GitHub Pages) e confira se o arquivo está na mesma pasta.</div>';return}if(!localStorage.getItem('gi_user'))localStorage.setItem('gi_user','Administrador');document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{page=b.dataset.page;selectedActivity=null;render()});render()}
init();
</script></body></html>
