<script>
const $=s=>document.querySelector(s);let DB={},page='home',projectId=null,selectedActivity=null,adminTab='Projetos',filterStatus='Todos';
const statuses=['Pendente','Em andamento','Concluída','Quebra'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=k=>DB[k]||[];const project=()=>arr('projects').find(x=>x.id===projectId);
function toast(s){let t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function save(){localStorage.setItem('gestaoImplantacaoDB',JSON.stringify(DB))}
function log(action,detail='',actId=''){DB.log.unshift({id:'log_'+Date.now(),data:{act:action,action,detail,actId,ts:new Date().toISOString(),user:localStorage.getItem('gi_user')||'Administrador'}});save()}
function normStatus(s){if(!s)return'Pendente';let v=String(s).toLowerCase();if(v.includes('andamento'))return'Em andamento';if(v.includes('conclu'))return'Concluída';if(v.includes('quebra')||v.includes('aband'))return'Quebra';return'Pendente'}
function getName(p){return p?.data?.name||p?.id||'Projeto'}
function activityName(a){let r=a.data.row||{};return r['ID VGR']||r['ID']||a.id}
function projectActivities(){let p=project();return arr('activities').filter(a=>{let r=a.data.row||{};return !p||!p.data.name||String(r.EMPRESA||'').toLowerCase()===String(p.data.name).toLowerCase()||a.data.projectId===p.id})}
function render(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#sectionEyebrow').textContent=page==='home'?'PROJETOS':page==='runbook'?'RUNBOOK':page==='logs'?'AUDITORIA':'ADMINISTRAÇÃO';$('#watermark').textContent=project()?('PROJETO '+getName(project()).toUpperCase()):'';$('#pageTitle').textContent=page==='home'?(project()?'Projeto '+getName(project()):'Selecione um projeto'):page==='runbook'?'Realizar runbook':page==='logs'?'Log de atividades':'Painel do administrador';if(page==='home')renderHome();if(page==='runbook')renderRunbook();if(page==='logs')renderLogs();if(page==='admin')renderAdmin()}
function renderHome(){let c=$('#appContent');if(!project()){c.innerHTML=`<div class="panel project-picker"><input id="projectSearch" placeholder="Buscar projeto pelo nome..."><div class="grid">${arr('projects').map(p=>`<div class="project" data-project="${esc(p.id)}"><div class="letter">${esc(getName(p).slice(0,1))}</div><div><b>${esc(getName(p))}</b></div><div class="sub small">${arr('activities').filter(a=>String((a.data.row||{}).EMPRESA||'').toLowerCase()===getName(p).toLowerCase()).length} atividades</div></div>`).join('')}</div></div>`;let search=$('#projectSearch');search.oninput=()=>c.querySelectorAll('[data-project]').forEach(el=>el.classList.toggle('hidden',!el.innerText.toLowerCase().includes(search.value.toLowerCase())));c.querySelectorAll('[data-project]').forEach(el=>el.onclick=()=>{projectId=el.dataset.project;selectedActivity=null;render()});return}
let acts=projectActivities();let counts=Object.fromEntries(statuses.map(s=>[s,acts.filter(a=>normStatus(a.data.status)===s).length]));const metricSvg={users:'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M17 23a7 7 0 1 0 0-14 7 7 0 0 0 0 14Zm15-2a6 6 0 1 0 0-12 6 6 0 0 0 0 12ZM4 37v-4c0-6 5-10 13-10s13 4 13 10v4H4Zm25-12c7-1 14 3 14 9v3H33v-4c0-3-1-6-4-8Z" fill="currentColor"/></svg>',tools:'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M29 7a12 12 0 0 0-13 15L5 33a4 4 0 0 0 6 6l11-11A12 12 0 0 0 37 15l-7 7-6-1-1-6 6-8Z" fill="currentColor"/><path d="m27 27 4-4 12 12a4 4 0 0 1-6 6L27 27ZM7 7l8 8-4 4-8-8 4-4Z" fill="currentColor"/></svg>',hourglass:'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 5h24v5c0 7-5 10-9 14 4 4 9 7 9 14v5H12v-5c0-7 5-10 9-14-4-4-9-7-9-14V5Zm5 5c0 5 3 8 7 11 4-3 7-6 7-11H17Zm7 18c-4 3-7 6-7 10h14c0-4-3-7-7-10Z" fill="currentColor"/></svg>',clipboard:'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 7h16a3 3 0 0 1 3 3h4v32H9V10h4a3 3 0 0 1 3-3Zm2 4v3h12v-3H18Zm-3 9h18v3H15v-3Zm0 7h18v3H15v-3Zm0 7h13v3H15v-3Z" fill="currentColor"/></svg>',check:'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 5h24a4 4 0 0 1 4 4v30a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4Zm3 18 6 6 13-13 4 4-17 17-10-10 4-4Z" fill="currentColor"/></svg>',alert:'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M21 6a3 3 0 0 1 6 0l18 32a3 3 0 0 1-3 5H6a3 3 0 0 1-3-5L21 6Zm3 8-2 15h4l-2-15Zm0 19a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z" fill="currentColor"/></svg>'};let metrics=[['users','Analistas totais',new Set(acts.map(a=>a.data.analystId||a.data.analystName).filter(Boolean)).size,'blue'],['tools','Analistas em atividade',new Set(acts.filter(a=>normStatus(a.data.status)==='Em andamento').map(a=>a.data.analystId||a.data.analystName).filter(Boolean)).size,'purple'],['hourglass','Pendentes (projeto)',counts['Pendente'],'yellow'],['clipboard','Em andamento',counts['Em andamento'],'green'],['check','Migradas',counts['Concluída'],'green'],['alert','Quebras',counts['Quebra'],'red']];c.innerHTML=`<div class="project-dashboard"><div class="detailhead"><button class="secondary" id="backProjects">← Projetos</button><div class="tabs date-tabs"><button class="active" data-period="Hoje">Hoje</button><button data-period="Outro dia">Outro dia</button><button data-period="Total geral">Total geral</button></div></div><div class="eyebrow" style="margin:8px 0 26px">VISÃO<br>GERAL</div><div class="stats">${metrics.map(([ic,label,n,color])=>`<div class="stat metric-${color}"><span class="metric-icon">${metricSvg[ic]}</span><div><span>${label}</span><b>${n}</b></div></div>`).join('')}</div><div class="filters stage-chips"><span>Contatando técnico: <b>${acts.filter(a=>String(a.data.status||'').toLowerCase().includes('contatando')).length}</b></span><span>Iniciando configuração: <b>0</b></span><span>Finalizando configuração: <b>0</b></span></div><h3 style="margin:18px 0 10px">Buscar atividade</h3><input id="searchActivity" placeholder="Buscar por ID, ID do link ou ID do VGR" style="width:100%;padding:14px"><div class="sub" style="margin:10px 0 14px">Digite um ID para buscar entre ${acts.length} atividades.</div><div id="activityList"></div>${selectedActivity?activityDetail(selectedActivity):''}</div>`;
$('#backProjects').onclick=()=>{projectId=null;selectedActivity=null;render()};c.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{c.querySelectorAll('[data-period]').forEach(x=>x.classList.toggle('active',x===b));filterStatus='Todos';renderActivityList()});$('#searchActivity').oninput=renderActivityList;renderActivityList();wireDetail()}
function renderActivityList(){let q=($('#searchActivity')?.value||'').toLowerCase();let acts=projectActivities().filter(a=>(filterStatus==='Todos'||normStatus(a.data.status)===filterStatus)&&JSON.stringify(a.data.row||{}).toLowerCase().includes(q));$('#activityList').innerHTML=acts.slice(0,150).map(a=>{let r=a.data.row||{};return `<div class="panel" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;margin:7px 0"><div><b>${esc(activityName(a))}</b><div class="small muted">${esc(r.HOSTNAME||r['ENDEREÇO COMPLETO']||r.EMPRESA||'Atividade')} · ${esc(r['ENDEREÇO COMPLETO']||'')}</div></div><div style="display:flex;align-items:center;gap:8px"><span class="status ${esc(normStatus(a.data.status))}">${esc(normStatus(a.data.status))}</span><button data-open="${esc(a.id)}">Abrir</button></div></div>`}).join('')||'<div class="empty">Nenhuma atividade encontrada.</div>';$('#activityList').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selectedActivity=b.dataset.open;render()})}
function activityDetail(id){let a=arr('activities').find(x=>x.id===id);if(!a)return'';let d=a.data,r=d.row||{},ed=d.ed||{};const groups=[['Equipamento e rede',['EQUIPAMENTO','QTD','UNIDADES COM FORTINET','NETWORK','NET WORK PARA CLONAR','HOSTNAME','LOTE','UNIDADE']],['Dados do link',['ID','ID DEDICADO','ID INTERNET','PRODUTO','VELOCIDADE DO LINK','MEIOS','OPERADORA']],['Endereço e coordenadas',['EMPRESA','ENDEREÇO COMPLETO','MUNICIPIO','COORDENADAS GEOGRÁFICAS']]];let known=new Set(groups.flatMap(g=>g[1]));let extra=Object.entries(r).filter(([k])=>!known.has(k));const fields=(entries)=>entries.filter(([k,v])=>v!==undefined).map(([k,v])=>`<div class="field"><label>${esc(k)}</label><input readonly value="${esc(v)}" title="${esc(v)}"></div>`).join('');return `<div class="panel" id="activityDetail"><div class="detailhead"><div><div class="eyebrow">ID VGR</div><h2 style="margin:4px 0">${esc(activityName(a))}</h2><span class="muted small">${esc(r['ENDEREÇO COMPLETO']||'')}</span></div><button class="secondary" id="closeDetail">← Voltar à lista</button></div><div class="row" style="margin:14px 0"><div class="field"><label>Status</label><select id="actStatus">${statuses.map(s=>`<option ${normStatus(d.status)===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Analista responsável</label><input id="actAnalyst" value="${esc(d.analystName||'')}" placeholder="Nome do analista"></div><div class="field"><label>Motivo da quebra</label><input id="actReason" value="${esc(d.reason||'')}" placeholder="Se aplicável"></div></div>${groups.map(([title,keys])=>`<section class="panel"><div class="section-label">${title}</div><div class="detail-grid">${fields(keys.filter(k=>r[k]!==undefined).map(k=>[k,r[k]]))}</div></section>`).join('')}<section class="panel"><div class="section-label">Dados técnicos editáveis</div><div class="detail-grid">${[['Modelo do equipamento','modelo',r.EQUIPAMENTO||ed.modelo||''],['Serial do equipamento','serial',ed.serial||''],['Nome do técnico','tecnico',ed.tecnico||''],['Telefone do técnico','telefone',ed.telefone||''],['Rede LAN Meraki','rede',r['REDE LAN MERAKI']||ed.rede||''],['IP LAN Meraki','ip',r['IP LAN MERAKI']||ed.ip||'']].map(([label,key,val])=>`<div class="field"><label>${label}</label><input data-ed="${key}" value="${esc(val)}"></div>`).join('')}</div></section>${extra.length?`<section class="panel"><div class="section-label">Outras informações</div><div class="detail-grid">${fields(extra)}</div></section>`:''}<div class="filters"><button id="adoptActivity">Assumir atividade</button><button id="saveActivity">Salvar alterações</button><button class="secondary" id="startActivity">Iniciar</button><button class="secondary" id="finishActivity">Concluir</button></div></div>`}
function wireDetail(){if(!$('#activityDetail'))return;$('#closeDetail').onclick=()=>{selectedActivity=null;render()};const update=(status)=>{let a=arr('activities').find(x=>x.id===selectedActivity);a.data.status=status;if(status==='Em andamento'&&!a.data.startAt)a.data.startAt=new Date().toISOString();if(status==='Concluída')a.data.endAt=new Date().toISOString();if(status==='Quebra')a.data.reason=$('#actReason').value;log('Status alterado',`${activityName(a)}: ${status}`,a.id);save();toast('Atividade atualizada');render()};$('#adoptActivity').onclick=()=>{let a=arr('activities').find(x=>x.id===selectedActivity);a.data.analystName=$('#actAnalyst').value||localStorage.getItem('gi_user')||'Administrador';a.data.analystId=a.data.analystName;a.data.status='Em andamento';a.data.startAt=a.data.startAt||new Date().toISOString();log('Atividade assumida',activityName(a),a.id);save();render()};$('#saveActivity').onclick=()=>{let a=arr('activities').find(x=>x.id===selectedActivity);a.data.status=$('#actStatus').value;a.data.analystName=$('#actAnalyst').value;a.data.reason=$('#actReason').value;a.data.ed=a.data.ed||{};document.querySelectorAll('[data-ed]').forEach(el=>a.data.ed[el.dataset.ed]=el.value);log('Editou dados',activityName(a),'');save();toast('Alterações salvas');render()};$('#startActivity').onclick=()=>update('Em andamento');$('#finishActivity').onclick=()=>update('Concluída')}
function renderRunbook(){let acts=projectActivities(),q='';$('#appContent').innerHTML=`<div class="panel"><h3>Buscar atividade</h3><input id="rbSearch" placeholder="Digite o ID, VGR ou hostname" style="width:100%"></div><div id="rbList"></div>`;function list(){let query=$('#rbSearch').value.toLowerCase();let list=acts.filter(a=>JSON.stringify(a.data.row||{}).toLowerCase().includes(query));$('#rbList').innerHTML=list.slice(0,100).map(a=>{let r=a.data.row||{};return `<div class="panel"><div class="detailhead"><div><b>${esc(activityName(a))}</b><div class="small muted">${esc(r.HOSTNAME||r['ENDEREÇO COMPLETO']||'')}</div></div><button data-rb="${esc(a.id)}">Realizar runbook</button></div></div>`}).join('')||'<div class="empty">Nenhuma atividade encontrada.</div>';$('#rbList').querySelectorAll('[data-rb]').forEach(b=>b.onclick=()=>openRunbook(b.dataset.rb))}$('#rbSearch').oninput=list;list()}
function openRunbook(id){let a=arr('activities').find(x=>x.id===id);let r=a.data.row||{};let existing=arr('runbooks').find(x=>x.data.activityId===id);let slots=existing?.data.slots||[];let defaults=['Validar acesso ao equipamento','Validar conectividade','Validar endereçamento IP','Validar LAN/WAN','Registrar evidências','Validar serviço com o solicitante'];$('#appContent').innerHTML=`<div class="panel"><button class="secondary" id="rbBack">← Voltar</button><h2>Runbook · ${esc(activityName(a))}</h2><p class="muted">${esc(r.HOSTNAME||r['ENDEREÇO COMPLETO']||'')}</p><div id="rbSteps">${defaults.map((s,i)=>{let val=slots[i]||{};return `<div class="panel"><label><input type="checkbox" data-step="${i}" ${val.done?'checked':''}> ${esc(s)}</label><textarea data-note="${i}" placeholder="Evidências / observações" style="width:100%;margin-top:8px">${esc(val.note||'')}</textarea></div>`}).join('')}</div><button id="saveRunbook">Salvar runbook</button></div>`;$('#rbBack').onclick=render;$('#saveRunbook').onclick=()=>{let run=arr('runbooks').find(x=>x.data.activityId===id);if(!run){run={id:'rb_'+Date.now(),data:{activityId:id,slots:[],by:localStorage.getItem('gi_user')||'Administrador',startedAt:new Date().toISOString()}};DB.runbooks.push(run)}run.data.slots=defaults.map((s,i)=>({title:s,done:$(`[data-step="${i}"]`).checked,note:$(`[data-note="${i}"]`).value}));run.data.updatedAt=new Date().toISOString();log('Runbook salvo',activityName(a),id);save();toast('Runbook salvo')}}
function renderLogs(){let logs=arr('log');$('#appContent').innerHTML=`<div class="panel"><h3>Histórico de ações</h3><div class="filters"><input id="logSearch" placeholder="Buscar por ação, usuário ou detalhe" style="flex:1"><button id="exportLogs">Exportar CSV</button></div><div class="tablewrap"><table><thead><tr><th>Data</th><th>Ação</th><th>Usuário</th><th>Detalhe</th></tr></thead><tbody id="logsBody"></tbody></table></div></div>`;function draw(){let q=$('#logSearch').value.toLowerCase();$('#logsBody').innerHTML=logs.filter(x=>JSON.stringify(x.data).toLowerCase().includes(q)).slice(0,500).map(x=>`<tr><td>${esc(x.data.ts||'')}</td><td>${esc(x.data.act||x.data.action||'')}</td><td>${esc(x.data.user||'')}</td><td>${esc(x.data.detail||x.data.actId||'')}</td></tr>`).join('')}$('#logSearch').oninput=draw;$('#exportLogs').onclick=()=>downloadCSV('logs.csv',logs.map(x=>x.data));draw()}
function renderAdmin(){let tabs=['Projetos','Usuários','Planilhas'];$('#appContent').innerHTML=`<div class="tabs">${tabs.map(t=>`<button class="${adminTab===t?'active':''}" data-atab="${t}">${t}</button>`).join('')}</div><div id="adminBody"></div>`;document.querySelectorAll('[data-atab]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.atab;renderAdmin()});let b=$('#adminBody');if(adminTab==='Projetos'){b.innerHTML=`<div class="panel"><h3>Cadastrar novo projeto</h3><div class="field"><label>Nome do projeto *</label><input id="newProject" placeholder="Ex.: COPASA"></div><div class="admin-checks">${['Modelo do equipamento','Serial do equipamento','Nome do técnico','Telefone do técnico','Rede LAN Meraki','IP LAN Meraki'].map((x,i)=>`<label><input type="checkbox" checked data-project-field="${i}"> ${x}</label>`).join('')}</div><button id="createProject" style="margin-top:4px">Criar projeto</button><div class="sub small" style="margin-top:8px">Selecione os campos técnicos que devem aparecer no projeto.</div></div><div class="panel"><h3>Projetos cadastrados</h3>${arr('projects').map(p=>`<div class="detailhead panel"><div><b>${esc(getName(p))}</b><div class="small muted">${arr('activities').filter(a=>String((a.data.row||{}).EMPRESA||'').toLowerCase()===getName(p).toLowerCase()).length} atividades</div></div><button class="secondary" data-selectp="${esc(p.id)}">Selecionar</button></div>`).join('')}</div>`;$('#createProject').onclick=()=>{let name=$('#newProject').value.trim();if(!name)return toast('Informe o nome do projeto');let id=name.toLowerCase().replace(/[^a-z0-9]+/g,'-');if(arr('projects').some(p=>p.id===id))return toast('Projeto já existe');DB.projects.push({id,data:{name,fields:[...document.querySelectorAll('[data-project-field]')].filter(x=>x.checked).map(x=>Number(x.dataset.projectField)),createdAt:new Date().toISOString()}});log('Projeto criado',name);save();renderAdmin()};b.querySelectorAll('[data-selectp]').forEach(x=>x.onclick=()=>{projectId=x.dataset.selectp;page='home';render()})}
if(adminTab==='Usuários'){b.innerHTML=`<div class="panel"><h3>Cadastrar usuário</h3><div class="row"><div class="field"><label>Nome</label><input id="uName"></div><div class="field"><label>Sobrenome</label><input id="uLast"></div><div class="field"><label>E-mail</label><input id="uEmail" type="email"></div><div class="field"><label>RE / matrícula</label><input id="uRe"></div></div><button id="createUser" style="margin-top:12px">Salvar usuário</button></div><div class="panel"><h3>Usuários cadastrados</h3>${arr('users').map(u=>`<div class="panel"><b>${esc((u.data.nome||'')+' '+(u.data.sobrenome||''))}</b><div class="small muted">${esc(u.data.email||'')} · ${esc(u.data.re||'')}</div></div>`).join('')||'<div class="empty">Nenhum usuário.</div>'}</div>`;$('#createUser').onclick=()=>{let nome=$('#uName').value.trim(),email=$('#uEmail').value.trim();if(!nome||!email)return toast('Nome e e-mail são obrigatórios');DB.users.push({id:'u_'+Date.now(),data:{nome,sobrenome:$('#uLast').value,email,re:$('#uRe').value,at:new Date().toISOString()}});log('Usuário cadastrado',email);save();renderAdmin()}}
if(adminTab==='Planilhas'){b.innerHTML=`<div class="panel"><h3>Importar planilha de atividades</h3><p class="muted">Importe CSV (UTF-8). A primeira linha deve conter os nomes das colunas, como EMPRESA, ID, ID VGR, HOSTNAME e ENDEREÇO COMPLETO.</p><label class="filelabel">Escolher arquivo CSV<input type="file" id="activityFile" accept=".csv,.txt"></label><button id="exportActivities" class="secondary">Exportar atividades CSV</button><div id="importResult" class="small muted" style="margin-top:12px"></div></div><div class="panel"><h3>Importar runbook em JSON</h3><label class="filelabel">Escolher arquivo JSON<input type="file" id="runbookFile" accept=".json"></label><div class="small muted">Importa uma lista de etapas para o conjunto de runbooks.</div></div>`;$('#activityFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;let text=await f.text(),rows=parseCSV(text);if(rows.length<2)return toast('CSV vazio ou inválido');let headers=rows[0];let added=0;for(let row of rows.slice(1)){if(!row.some(v=>v.trim()))continue;let obj={};headers.forEach((h,i)=>obj[h.trim()]=row[i]||'');let id='imp_'+Date.now()+'_'+added;DB.activities.push({id,data:{row:obj,status:'Pendente',analystName:null,analystId:null,startAt:null,endAt:null,reason:null,keys:Object.values(obj).join('|')}});added++}log('Importação CSV',`${added} atividades importadas`);save();$('#importResult').textContent=`Importadas ${added} atividades.`;toast('Importação concluída')};$('#exportActivities').onclick=()=>downloadCSV('atividades.csv',arr('activities').map(a=>({...a.data.row,_status:a.data.status,_analista:a.data.analystName,_motivo:a.data.reason})));$('#runbookFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());DB.runbookTemplate=Array.isArray(x)?x:(x.steps||x.slots||[]);save();toast('Modelo de runbook importado')}catch{toast('JSON inválido')}}}}
function parseCSV(t){let out=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'&&q&&t[i+1]==='"'){cell+='"';i++}else if(c==='"')q=!q;else if((c===','||c===';'||c==='\\t')&&!q){row.push(cell);cell=''}else if((c==='\\n'||c==='\\r')&&!q){if(c==='\\r'&&t[i+1]==='\\n')i++;row.push(cell);out.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);out.push(row)}return out}
function downloadCSV(name,rows){let keys=[...new Set(rows.flatMap(o=>Object.keys(o||{})))];let csv=[keys,...rows.map(o=>keys.map(k=>{let v=o[k];if(v&&typeof v==='object')v=JSON.stringify(v);return '"'+String(v??'').replace(/"/g,'""')+'"'}))].map(r=>r.join(';')).join('\\r\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
async function init(){try{let saved=localStorage.getItem('gestaoImplantacaoDB');if(saved)DB=JSON.parse(saved);else{let res=await fetch('./data.json');DB=await res.json();save()}}catch(e){$('#appContent').innerHTML='<div class="panel">Não foi possível carregar data.json. Execute por servidor local (ex.: GitHub Pages) e confira se o arquivo está na mesma pasta.</div>';return}if(!localStorage.getItem('gi_user'))localStorage.setItem('gi_user','Administrador');document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{page=b.dataset.page;selectedActivity=null;render()});render()}
init();
</script></body></html>
